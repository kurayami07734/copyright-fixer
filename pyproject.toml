[project]
name = "copyright-fixer"
version = "0.1.0"
description = "CLI to maintain copyright notices in code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Aditya Ghidora", email = "adityaghidora+dev@gmail.com" }]
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/kurayami07734/copyright-fixer"

[project.scripts]
copyright_fixer = "src.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
